<script>
/* Storefront: renders products, categories, cart, product sheet. */
(function () {
  'use strict';
  const E = window.Elion, $ = E.$, $$ = E.$$, esc = E.esc;
  const S = E.shop = { products: [], settings: {}, cat: 'all', q: '', sort: 'default', favOnly: false };
  let cart = E.store('elion_cart') || [];       // [{id, qty}]
  let favs = new Set(E.store('elion_favs') || []);
  const saveCart = () => E.store('elion_cart', cart);
  const byId = id => S.products.find(p => p.id === id);
  const catLabel = id => (S.settings.categories || []).find(c => c.id === id);

  function waNumber() { return String(S.settings.whatsapp || '').replace(/\D/g, ''); }
  function waOpen(text) {
    const n = waNumber();
    window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(text), '_blank');
  }
  S.chat = () => {
    const name = S.settings.storeName || 'Elion Phones';
    const lines = cart.map(c => byId(c.id)).filter(Boolean);
    let msg = 'Hello ' + name + ' 👋';
    if (cart.length) {
      msg += '\n\nI want to order:\n'; let total = 0;
      cart.forEach(c => { const p = byId(c.id); if (!p) return; total += p.price * c.qty; msg += '• ' + p.name + ' — ' + p.spec + ' — ' + (p.price ? E.money(p.price) : 'price on request') + (c.qty > 1 ? ' × ' + c.qty : '') + '\n'; });
      msg += '\nTotal: ' + E.money(total);
    }
    waOpen(msg);
  };

  /* ---------- settings -> page ---------- */
  S.applySettings = () => {
    const s = S.settings;
    document.title = s.storeName || 'Elion Phones';
    document.documentElement.style.setProperty('--accent', s.accent || '#8be44d');
    $('#shop').classList.toggle('no3d', s.show3d === false);
    const custom = !!s.logoUrl;
    ['#navLogo'].forEach(sel => { const im = $(sel); im.src = custom ? s.logoUrl : window.__ELION_LOGO; im.classList.toggle('custom', custom); });
    $('#heroKicker').textContent = s.heroKicker || '';
    $('#heroTitle').innerHTML = esc(s.heroLine1) + '<br><span>' + esc(s.heroAccent) + '</span> ' + esc(s.heroLine2);
    $('#heroP').textContent = s.heroText || '';
    $('#heroBtn').innerHTML = esc(s.heroButton || 'SHOP NOW') + ' <b>→</b>';
    $('#hero').style.backgroundImage = s.heroImage ? 'url("' + s.heroImage + '")' : '';
    const items = (s.ticker && s.ticker.length ? s.ticker : ['NEW ARRIVALS']);
    const row = items.concat(items).concat(items.length < 4 ? items.concat(items) : []);
    $('#track').innerHTML = row.map(t => '<span>' + esc(t) + '</span>').join('');
    $('#offerTitle').textContent = s.offerTitle || ''; $('#offerText').textContent = s.offerText || ''; $('#offerBtn').textContent = s.offerButton || 'SEE DEALS';
    $('.offer').hidden = !(s.offerTitle || s.offerText);
    renderCats(); renderFooter();
  };
  function renderFooter() {
    const s = S.settings, custom = !!s.logoUrl;
    const bits = [];
    if (s.phone) bits.push('<span>📞 ' + esc(s.phone) + '</span>');
    if (waNumber()) bits.push('<span>💬 WhatsApp +' + esc(waNumber()) + '</span>');
    if (s.address) bits.push('<span>📍 ' + esc(s.address) + '</span>');
    if (s.hours) bits.push('<span>🕘 ' + esc(s.hours) + '</span>');
    if (s.instagram) bits.push('<span>📷 ' + esc(s.instagram) + '</span>');
    $('#footer').innerHTML = '<div class="fwrap"><img class="flogo' + (custom ? ' custom' : '') + '" src="' + esc(custom ? s.logoUrl : window.__ELION_LOGO) + '" alt="' + esc(s.storeName) + '">' +
      '<p>' + esc(s.footerText || '') + '</p>' + (bits.length ? '<div class="contact">' + bits.join('') + '</div>' : '') +
      '<a class="adminLink" href="#admin" id="adminLink">Admin</a></div>';
    $('#adminLink').addEventListener('click', e => { e.preventDefault(); E.openAdmin(); });
  }

  /* ---------- categories ---------- */
  function renderCats() {
    const cats = [{ id: 'all', label: 'All' }].concat(S.settings.categories || []).concat([{ id: 'deal', label: 'Best Deals' }]);
    if (!cats.some(c => c.id === S.cat)) S.cat = 'all';
    $('#cats').innerHTML = cats.map(c => '<button class="cat' + (c.id === S.cat ? ' active' : '') + '" data-cat="' + esc(c.id) + '">' + esc(c.label) + '</button>').join('');
  }

  /* ---------- product grid ---------- */
  function visible() {
    const q = S.q.toLowerCase().trim();
    let list = S.products.filter(p => {
      if (S.cat === 'deal' && !p.deal) return false;
      if (S.cat !== 'all' && S.cat !== 'deal' && p.category !== S.cat) return false;
      if (S.favOnly && !favs.has(p.id)) return false;
      if (q) { const c = catLabel(p.category); const t = (p.name + ' ' + p.spec + ' ' + p.tag + ' ' + (c ? c.label : '')).toLowerCase(); if (!q.split(/\s+/).every(w => t.includes(w))) return false; }
      return true;
    });
    if (S.sort === 'low') list.sort((a, b) => (a.price || 1e12) - (b.price || 1e12));
    else if (S.sort === 'high') list.sort((a, b) => b.price - a.price);
    else if (S.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
    return list;
  }
  function card(p, i) {
    const img = p.images && p.images[0] ? '<img loading="lazy" decoding="async" src="' + esc(p.images[0]) + '" alt="' + esc(p.name) + '">' : '';
    const rating = S.settings.showRatings !== false && p.rating ? '<div class="stars">★★★★★ <small>' + Number(p.rating).toFixed(1) + '</small></div>' : '<div class="stars">&nbsp;</div>';
    const priceHtml = p.price ? '<div><strong>' + E.money(p.price) + '</strong>' + (p.oldPrice > p.price ? '<s>' + E.money(p.oldPrice) + '</s>' : '') + '</div>' : '<strong class="ask">Call for price</strong>';
    let btn;
    if (!p.inStock) btn = '<button class="cartBtn" disabled aria-label="Sold out">🛒</button>';
    else if (!p.price) btn = '<button class="cartBtn" data-ask="' + esc(p.id) + '" aria-label="Ask for price">💬</button>';
    else btn = '<button class="cartBtn" data-add="' + esc(p.id) + '" aria-label="Add to cart">🛒</button>';
    return '<article class="product" style="animation-delay:' + Math.min(i, 12) * 35 + 'ms" data-id="' + esc(p.id) + '">' +
      '<div class="photo" data-open="' + esc(p.id) + '"><span class="stock' + (p.inStock ? '' : ' out') + '">' + (p.inStock ? 'In stock' : 'Sold out') + '</span>' +
      '<button class="fav' + (favs.has(p.id) ? ' on' : '') + '" data-fav="' + esc(p.id) + '" aria-label="Save">' + (favs.has(p.id) ? '♥' : '♡') + '</button>' + img + '</div>' +
      '<div class="info">' + (p.tag ? '<span class="tag">' + esc(p.tag) + '</span>' : '<span></span>') + '<h3>' + esc(p.name) + '</h3><p>' + esc(p.spec) + '</p>' + rating +
      '<div class="priceRow">' + priceHtml + btn + '</div></div></article>';
  }
  S.render = () => {
    const list = visible();
    $('#grid').innerHTML = list.map(card).join('');
    $('#result').textContent = list.length + ' product' + (list.length === 1 ? '' : 's');
    $('#empty').style.display = list.length ? 'none' : 'block';
    const c = [{ id: 'all', label: 'Featured Phones' }, { id: 'deal', label: 'Best Deals' }].concat(S.settings.categories || []).find(x => x.id === S.cat);
    $('#listTitle').textContent = S.cat === 'all' ? 'Featured Phones' : (c ? c.label : 'Products');
  };

  /* ---------- cart ---------- */
  function updateCart() {
    const n = cart.reduce((s, c) => s + c.qty, 0);
    $('#count').textContent = n;
    let total = 0;
    const rows = cart.map(c => { const p = byId(c.id); if (!p) return ''; total += p.price * c.qty;
      return '<div class="cartItem"><img src="' + esc(p.images[0] || '') + '" alt=""><div style="flex:1;min-width:0"><h4>' + esc(p.name) + '</h4><p>' + esc(p.spec) + '</p><strong>' + (p.price ? E.money(p.price) : 'Price on request') + '</strong>' +
        '<div class="qty"><button data-dec="' + esc(p.id) + '" aria-label="Less">−</button><span>' + c.qty + '</span><button data-inc="' + esc(p.id) + '" aria-label="More">+</button></div></div><button class="rm" data-rm="' + esc(p.id) + '">Remove</button></div>'; }).join('');
    $('#cartList').innerHTML = rows || '<p class="cartEmpty">Your cart is empty.</p>';
    $('#total').textContent = E.money(total);
    $('#checkout').disabled = !n;
  }
  const add = (id, q) => {
    const p = byId(id); if (!p) return;
    const c = cart.find(x => x.id === id); if (c) c.qty = Math.min(20, c.qty + (q || 1)); else cart.push({ id, qty: q || 1 });
    saveCart(); updateCart(); E.toast(p.name + ' added to cart');
    const b = $('#count'); b.classList.add('bump'); setTimeout(() => b.classList.remove('bump'), 220);
  };
  const setQty = (id, d) => { const c = cart.find(x => x.id === id); if (!c) return; c.qty += d; if (c.qty < 1) cart = cart.filter(x => x !== c); saveCart(); updateCart(); };
  S.openCart = () => { updateCart(); $('#drawer').classList.add('open'); };
  const closeCart = () => $('#drawer').classList.remove('open');
  function ask(id) { const p = byId(id); if (!p) return; waOpen('Hello ' + (S.settings.storeName || 'Elion Phones') + ' 👋\n\nWhat is the price of the ' + p.name + ' (' + p.spec + ')? Is it available?'); }

  async function checkout() {
    const items = cart.map(c => { const p = byId(c.id); return p && { name: p.name, spec: p.spec, price: p.price, qty: c.qty }; }).filter(Boolean);
    if (!items.length) return;
    S.chat();                                           // open WhatsApp right away (popup-safe)
    try { await E.api.post('api/orders', { items }); } catch (e) { /* the order still reaches WhatsApp */ }
  }

  /* ---------- product sheet ---------- */
  function openSheet(id) {
    const p = byId(id); if (!p) return;
    const imgs = p.images && p.images.length ? p.images : [''];
    const c = catLabel(p.category);
    $('#sheetPanel').innerHTML =
      '<div class="galWrap"><div class="gal" id="gal">' + imgs.map(u => '<img src="' + esc(u) + '" alt="' + esc(p.name) + '" data-zoom="' + esc(u) + '">').join('') + '</div>' +
      (imgs.length > 1 ? '<div class="dots" id="dots">' + imgs.map((_, i) => '<i' + (i ? '' : ' class="on"') + '></i>').join('') + '</div>' : '') + '</div>' +
      '<button class="close" id="sheetClose" aria-label="Close">×</button>' +
      '<div class="sheetBody">' + (p.tag ? '<span class="tag">' + esc(p.tag) + '</span> ' : '') + (c ? '<span class="tag">' + esc(c.label) + '</span>' : '') +
      '<h2>' + esc(p.name) + '</h2><p class="spec">' + esc(p.spec) + '</p>' +
      '<div class="big">' + (p.price ? E.money(p.price) : 'Call for price') + (p.oldPrice > p.price ? '<s>' + E.money(p.oldPrice) + '</s>' : '') + '</div>' +
      '<div class="sheetBtns">' + (p.inStock && p.price ? '<button class="pri" data-add="' + esc(p.id) + '" data-close="1">Add to cart</button>' : '') +
      '<button class="wa" data-ask="' + esc(p.id) + '">' + (p.inStock ? 'Ask on WhatsApp' : 'Ask when back in stock') + '</button></div></div>';
    $('#sheet').classList.add('open');
    const gal = $('#gal');
    if (imgs.length > 1) gal.addEventListener('scroll', () => { const i = Math.round(gal.scrollLeft / gal.clientWidth); $$('#dots i').forEach((d, k) => d.classList.toggle('on', k === i)); });
  }
  const closeSheet = () => $('#sheet').classList.remove('open');
  const zoom = u => { $('#zoomImage').src = u; $('#zoomViewer').classList.add('open'); };

  /* ---------- events ---------- */
  const go = id => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth' }); $('#menuPanel').classList.remove('open'); };
  S.bind = () => {
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-add],[data-ask],[data-fav],[data-open],[data-cat],[data-inc],[data-dec],[data-rm],[data-go],[data-act],[data-zoom]');
      if (!t || $('#shop').offsetParent === null) return;
      const d = t.dataset;
      if (d.add) { add(d.add); if (d.close) closeSheet(); }
      else if (d.ask) ask(d.ask);
      else if (d.fav) { favs.has(d.fav) ? favs.delete(d.fav) : favs.add(d.fav); E.store('elion_favs', Array.from(favs)); if (S.favOnly) S.render(); else { t.classList.toggle('on'); t.textContent = favs.has(d.fav) ? '♥' : '♡'; } }
      else if (d.open) openSheet(d.open);
      else if (d.cat) { S.cat = d.cat; renderCats(); S.render(); }
      else if (d.inc) setQty(d.inc, 1); else if (d.dec) setQty(d.dec, -1);
      else if (d.rm) { cart = cart.filter(c => c.id !== d.rm); saveCart(); updateCart(); }
      else if (d.go) go(d.go);
      else if (d.zoom) zoom(d.zoom);
      else if (d.act === 'cart') { $('#menuPanel').classList.remove('open'); S.openCart(); }
      else if (d.act === 'wa') S.chat();
      else if (d.act === 'theme') E.toggleTheme();
    });
    $('#menuBtn').onclick = () => $('#menuPanel').classList.toggle('open');
    $('#themeBtn').onclick = () => E.toggleTheme();
    $('#cartBtn').onclick = S.openCart; $('#cartClose').onclick = closeCart;
    $('#drawer').addEventListener('click', e => { if (e.target.id === 'drawer') closeCart(); });
    $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet' || e.target.id === 'sheetClose') closeSheet(); });
    $('#zoomViewer').addEventListener('click', e => { if (e.target.id !== 'zoomImage') $('#zoomViewer').classList.remove('open'); });
    $('#waBtn').onclick = S.chat; $('#checkout').onclick = checkout;
    $('#heroBtn').onclick = () => go('products'); $('#offerBtn').onclick = () => { S.cat = 'deal'; renderCats(); S.render(); go('products'); };
    $('#seeAll').onclick = () => { S.cat = 'all'; renderCats(); S.render(); go('products'); };
    $('#search').addEventListener('input', e => { S.q = e.target.value; S.render(); });
    $('#searchBtn').onclick = () => { S.render(); go('products'); };
    $('#search').addEventListener('keydown', e => { if (e.key === 'Enter') { go('products'); e.target.blur(); } });
    $('#bSearch').onclick = () => { $('#search').scrollIntoView({ block: 'center' }); window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => $('#search').focus(), 350); };
    $('#sort').onchange = e => { S.sort = e.target.value; S.render(); };
    $('#favOnly').onclick = e => { S.favOnly = !S.favOnly; e.currentTarget.setAttribute('aria-pressed', S.favOnly); S.render(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); closeCart(); $('#zoomViewer').classList.remove('open'); } });
  };

  S.load = data => {
    S.products = data.products; S.settings = data.settings;
    cart = cart.filter(c => byId(c.id));
    S.applySettings(); S.render(); updateCart();
    E.startPhone(S.products.filter(p => p.featured).concat(S.products.filter(p => !p.featured)), id => openSheet(id));
  };
})();

</script>
<script>
/* Admin dashboard: control products, photos, categories, orders and every setting of the site. */
(function () {
  'use strict';
  const E = window.Elion, $ = E.$, $$ = E.$$, esc = E.esc, api = E.api;
  const A = { tab: 'dashboard', products: [], settings: {}, orders: [], stats: null, ed: null, filter: '', fcat: '', mounted: false, isDefault: false, dirty: false };
  const root = () => $('#admin');
  const TABS = [['dashboard', 'Dashboard', '▦'], ['products', 'Products', '📱'], ['orders', 'Orders', '🧾'], ['categories', 'Categories', '🏷'], ['site', 'Site', '🎨'], ['account', 'Account', '🔐']];
  let refreshTimer;
  const refreshShop = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(() => E.reloadStore && E.reloadStore().catch(() => {}), 250); };
  const num = v => Number(String(v == null ? '' : v).replace(/[^0-9]/g, '')) || 0;
  const catName = id => { const c = (A.settings.categories || []).find(x => x.id === id); return c ? c.label : (id || 'Other'); };
  const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString('en-NG', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' }); };
  const busy = async (btn, fn) => { if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = 'Please wait…'; } try { return await fn(); } finally { if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t; } } };
  const fail = e => E.toast(e && e.message ? e.message : 'Something went wrong', true);

  /* ------------------------------------------------ mount / login */
  const A_ = E.admin = {};
  A_.mount = async function () {
    if (!A.mounted) { A.mounted = true; bind(); }
    E.onLoggedOut = () => { if (!root().hidden) renderLogin('Your session ended. Please log in again.'); };
    if (!api.hasToken()) return renderLogin();
    try { const me = await api.get('api/me'); A.isDefault = !!me.isDefaultPassword; await loadAll(); renderShell(); }
    catch (e) { api.setToken(null); renderLogin(); }
  };
  function renderLogin(msg) {
    root().innerHTML = '<div class="adm-login"><form class="adm-card" id="loginForm"><img class="adm-logo" src="img/brand/logo.png" alt="Elion Phones">' +
      '<h1>Admin login</h1><p class="muted">Enter your admin password to manage the store.</p>' + (msg ? '<p class="adm-msg err">' + esc(msg) + '</p>' : '') +
      (E.isDemo() ? '<p class="adm-msg">Preview mode: changes are saved in this browser only. Password: <b>elion2026</b></p>' : '') +
      '<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required autofocus>' +
      '<button class="adm-btn pri" type="submit">Log in</button><a class="adm-link" href="./" id="backShop">← Back to store</a></form></div>';
    $('#backShop').onclick = e => { e.preventDefault(); E.closeAdmin(); };
  }
  async function doLogin(form) {
    const pw = $('#pw').value;
    try {
      const r = await api.post('api/login', { password: pw });
      api.setToken(r.token); A.isDefault = !!r.isDefaultPassword;
      await loadAll(); renderShell(); E.toast('Welcome back');
    } catch (e) { renderLogin(e.message); }
  }
  async function loadAll() {
    const [store, orders, stats] = await Promise.all([api.get('api/store'), api.get('api/orders'), api.get('api/stats')]);
    A.products = store.products; A.settings = store.settings; A.orders = orders.orders; A.stats = stats; A.dirty = false;
  }

  /* ------------------------------------------------ shell */
  function renderShell() {
    const newOrders = A.orders.filter(o => o.status === 'new').length;
    root().innerHTML = '<div class="adm">' +
      '<header class="adm-top"><img class="adm-logo sm" src="img/brand/logo.png" alt="Elion Phones"><span class="adm-pill">ADMIN</span><span class="grow"></span>' +
      '<button class="adm-btn ghost" data-a="view">View store</button><button class="adm-btn ghost icon" data-a="theme" aria-label="Theme">◐</button><button class="adm-btn ghost" data-a="logout">Log out</button></header>' +
      '<nav class="adm-tabs" role="tablist">' + TABS.map(t => '<button role="tab" class="' + (A.tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '"><span>' + t[2] + '</span>' + t[1] + (t[0] === 'orders' && newOrders ? '<i class="badge">' + newOrders + '</i>' : '') + '</button>').join('') + '</nav>' +
      '<main class="adm-main" id="admMain"></main></div><div id="admModal"></div>';
    renderTab();
  }
  function renderTab() {
    $$('.adm-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === A.tab));
    const m = $('#admMain'); if (!m) return;
    m.innerHTML = { dashboard, products, orders, categories, site, account }[A.tab]();
    if (A.tab === 'site') bindSiteDirty();
  }

  /* ------------------------------------------------ dashboard */
  function dashboard() {
    const s = A.stats || { days: [] }, max = Math.max(1, ...s.days.map(d => d.visits));
    const noPhoto = A.products.filter(p => !p.images || !p.images.length).length, noPrice = A.products.filter(p => !p.price).length, out = A.products.filter(p => !p.inStock).length;
    const tiles = [['Products', s.products, ''], ['In stock', s.inStock, ''], ['New orders', s.newOrders, s.newOrders ? 'hot' : ''], ['Visits today', (s.days[6] || {}).visits || 0, '']];
    const alerts = [];
    if (A.isDefault) alerts.push('<div class="adm-alert warn"><b>Change your password.</b> You are still using the starter password. <button class="adm-btn sm" data-tab="account">Change now</button></div>');
    if (E.isDemo()) alerts.push('<div class="adm-alert"><b>Preview mode.</b> This copy has no server, so changes are kept in this browser only. Run the project on your host (see README) to save for every visitor.</div>');
    if (noPhoto) alerts.push('<div class="adm-alert">' + noPhoto + ' product' + (noPhoto > 1 ? 's have' : ' has') + ' no photo.</div>');
    if (noPrice) alerts.push('<div class="adm-alert">' + noPrice + ' product' + (noPrice > 1 ? 's show' : ' shows') + ' “Call for price”. Add prices in Products.</div>');
    if (out) alerts.push('<div class="adm-alert">' + out + ' product' + (out > 1 ? 's are' : ' is') + ' marked sold out.</div>');
    return alerts.join('') +
      '<div class="adm-tiles">' + tiles.map(t => '<div class="adm-tile ' + t[2] + '"><small>' + t[0] + '</small><strong>' + t[1] + '</strong></div>').join('') + '</div>' +
      '<section class="adm-card"><h3>Visitors, last 7 days</h3><div class="adm-bars">' + s.days.map(d => '<div><i style="height:' + Math.max(4, Math.round(d.visits / max * 100)) + '%"></i><b>' + d.visits + '</b><small>' + new Date(d.day + 'T12:00:00').toLocaleDateString('en', { weekday: 'short' }) + '</small></div>').join('') + '</div></section>' +
      '<section class="adm-card"><h3>Shortcuts</h3><div class="adm-row wrap"><button class="adm-btn pri" data-a="add">+ Add product</button><button class="adm-btn" data-tab="site">Edit site text and look</button><button class="adm-btn" data-tab="categories">Manage categories</button><button class="adm-btn" data-a="view">View store</button></div></section>' +
      '<p class="muted small">Stock value (listed prices of items in stock): <b>' + E.money(s.stockValue) + '</b></p>';
  }

  /* ------------------------------------------------ products */
  function filtered() {
    const q = A.filter.toLowerCase().trim();
    return A.products.filter(p => (!A.fcat || p.category === A.fcat) && (!q || (p.name + ' ' + p.spec + ' ' + p.tag).toLowerCase().includes(q)));
  }
  function products() {
    const list = filtered(), canMove = !A.filter && !A.fcat;
    return '<div class="adm-bar"><input id="pf" type="search" placeholder="Search products…" value="' + esc(A.filter) + '"><select id="pc"><option value="">All categories</option>' +
      (A.settings.categories || []).map(c => '<option value="' + esc(c.id) + '"' + (A.fcat === c.id ? ' selected' : '') + '>' + esc(c.label) + '</option>').join('') + '</select>' +
      '<button class="adm-btn pri" data-a="add">+ Add product</button></div>' +
      '<p class="muted small">' + list.length + ' of ' + A.products.length + ' products' + (canMove ? '. Use the arrows to change the order shoppers see.' : '. Clear the filters to reorder.') + '</p>' +
      '<div class="adm-list">' + (list.map((p, i) => row(p, i, list.length, canMove)).join('') || '<div class="adm-empty">No products here yet. Tap “Add product”.</div>') + '</div>';
  }
  function row(p, i, n, canMove) {
    return '<div class="adm-item" data-id="' + esc(p.id) + '"><button class="thumb" data-edit="' + esc(p.id) + '" aria-label="Edit ' + esc(p.name) + '">' + (p.images && p.images[0] ? '<img loading="lazy" src="' + esc(p.images[0]) + '" alt="">' : '<span>No photo</span>') + (p.images && p.images.length > 1 ? '<i>' + p.images.length + '</i>' : '') + '</button>' +
      '<div class="meta" data-edit="' + esc(p.id) + '"><strong>' + esc(p.name) + '</strong><small>' + esc(p.spec) + '</small>' +
      '<div class="chips"><b class="price">' + (p.price ? E.money(p.price) : 'Call for price') + '</b><span>' + esc(catName(p.category)) + '</span>' + (p.deal ? '<span class="y">Deal</span>' : '') + (p.featured ? '<span class="y">Featured</span>' : '') + (!p.inStock ? '<span class="r">Sold out</span>' : '') + '</div></div>' +
      '<div class="acts"><label class="sw" title="In stock"><input type="checkbox" data-stock="' + esc(p.id) + '"' + (p.inStock ? ' checked' : '') + '><i></i></label>' +
      (canMove ? '<button class="adm-btn ghost icon" data-mv="up" data-id="' + esc(p.id) + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Move up">▲</button><button class="adm-btn ghost icon" data-mv="down" data-id="' + esc(p.id) + '"' + (i === n - 1 ? ' disabled' : '') + ' aria-label="Move down">▼</button>' : '') +
      '<button class="adm-btn ghost icon del" data-del="' + esc(p.id) + '" aria-label="Delete">🗑</button></div></div>';
  }
  async function move(id, dir) {
    const i = A.products.findIndex(p => p.id === id), j = i + (dir === 'up' ? -1 : 1);
    if (j < 0 || j >= A.products.length) return;
    [A.products[i], A.products[j]] = [A.products[j], A.products[i]];
    renderTab();
    try { await api.post('api/products/reorder', { ids: A.products.map(p => p.id) }); refreshShop(); } catch (e) { fail(e); }
  }
  let delArm = null;
  async function del(btn, id) {
    if (delArm !== id) { delArm = id; btn.classList.add('arm'); btn.textContent = 'Delete?'; setTimeout(() => { if (delArm === id) { delArm = null; if (btn.isConnected) { btn.classList.remove('arm'); btn.textContent = '🗑'; } } }, 3000); return; }
    delArm = null;
    try { await api.del('api/products/' + encodeURIComponent(id)); A.products = A.products.filter(p => p.id !== id); renderTab(); refreshShop(); E.toast('Product deleted'); } catch (e) { fail(e); }
  }

  /* ------------------------------------------------ product editor */
  function openEditor(id) {
    const p = id ? A.products.find(x => x.id === id) : null;
    A.ed = p ? JSON.parse(JSON.stringify(p)) : { name: '', spec: '', price: 0, oldPrice: 0, category: (A.settings.categories[0] || {}).id || 'other', tag: '', inStock: true, featured: false, deal: false, rating: 4.8, images: [] };
    const cats = (A.settings.categories || []).map(c => '<option value="' + esc(c.id) + '"' + (A.ed.category === c.id ? ' selected' : '') + '>' + esc(c.label) + '</option>').join('') + '<option value="other"' + (A.ed.category === 'other' ? ' selected' : '') + '>Other</option>';
    $('#admModal').innerHTML = '<div class="adm-modal" id="edModal"><form class="adm-sheet" id="edForm" novalidate>' +
      '<div class="adm-sheet-h"><h2>' + (p ? 'Edit product' : 'Add product') + '</h2><button type="button" class="adm-btn ghost icon" data-a="closeEd" aria-label="Close">✕</button></div>' +
      '<div class="adm-sheet-b"><label>Photos <small class="muted">First photo is the main one. You can add up to 8.</small></label><div id="photos" class="photos"></div>' +
      '<label for="f_name">Name</label><input id="f_name" value="' + esc(A.ed.name) + '" placeholder="iPhone 15 Pro Max" required>' +
      '<label for="f_spec">Details</label><input id="f_spec" value="' + esc(A.ed.spec) + '" placeholder="256GB • Brand New • Natural Titanium">' +
      '<div class="two"><div><label for="f_price">Price (' + esc(A.settings.currency || '₦') + ')</label><input id="f_price" inputmode="numeric" value="' + (A.ed.price || '') + '" placeholder="0 = call for price"></div>' +
      '<div><label for="f_old">Old price <small class="muted">(optional, shown crossed out)</small></label><input id="f_old" inputmode="numeric" value="' + (A.ed.oldPrice || '') + '"></div></div>' +
      '<div class="two"><div><label for="f_cat">Category</label><select id="f_cat">' + cats + '</select></div><div><label for="f_tag">Badge <small class="muted">(Hot, New…)</small></label><input id="f_tag" maxlength="24" value="' + esc(A.ed.tag) + '"></div></div>' +
      '<div class="two"><div><label for="f_rating">Rating (0 to 5)</label><input id="f_rating" inputmode="decimal" value="' + (A.ed.rating || '') + '"></div></div>' +
      '<div class="checks"><label class="chk"><input type="checkbox" id="f_stock"' + (A.ed.inStock ? ' checked' : '') + '> In stock</label><label class="chk"><input type="checkbox" id="f_deal"' + (A.ed.deal ? ' checked' : '') + '> Best deal</label><label class="chk"><input type="checkbox" id="f_feat"' + (A.ed.featured ? ' checked' : '') + '> Featured (shows first on the 3D phone)</label></div></div>' +
      '<div class="adm-sheet-f"><button type="button" class="adm-btn" data-a="closeEd">Cancel</button><button type="submit" class="adm-btn pri">' + (p ? 'Save changes' : 'Add product') + '</button></div></form></div>';
    document.body.classList.add('adm-lock');
    renderPhotos();
  }
  function renderPhotos() {
    const box = $('#photos'); if (!box) return;
    box.innerHTML = A.ed.images.map((u, i) => '<div class="ph' + (i === 0 ? ' main' : '') + '"><img src="' + esc(u) + '" alt=""><span>' + (i === 0 ? 'Main' : '') + '</span>' +
      '<div>' + (i > 0 ? '<button type="button" data-ph="main" data-i="' + i + '" title="Make main">★</button>' : '') + '<button type="button" data-ph="rm" data-i="' + i + '" title="Remove">✕</button></div></div>').join('') +
      (A.ed.images.length < 8 ? '<label class="ph add" for="f_files"><b>+</b><small>Add photos</small></label>' : '') + '<input id="f_files" type="file" accept="image/*" multiple hidden>';
    const fi = $('#f_files'); if (fi) fi.onchange = e => addFiles(e.target.files);
  }
  async function addFiles(files) {
    files = Array.from(files || []).slice(0, 8 - A.ed.images.length); if (!files.length) return;
    const box = $('#photos'); box.classList.add('loading');
    for (const f of files) { try { A.ed.images.push(await api.upload(f)); renderPhotos(); } catch (e) { fail(e); } }
    box.classList.remove('loading'); renderPhotos();
  }
  async function saveProduct(form) {
    const d = A.ed, v = id => $('#' + id).value;
    const body = { name: v('f_name').trim(), spec: v('f_spec').trim(), price: num(v('f_price')), oldPrice: num(v('f_old')), category: v('f_cat'), tag: v('f_tag').trim(), rating: Math.min(5, Math.max(0, parseFloat(v('f_rating')) || 0)),
      inStock: $('#f_stock').checked, deal: $('#f_deal').checked, featured: $('#f_feat').checked, images: d.images };
    if (!body.name) { $('#f_name').focus(); return E.toast('Please enter a product name', true); }
    const btn = $('button[type=submit]', form);
    await busy(btn, async () => {
      try {
        if (d.id) { const r = await api.put('api/products/' + encodeURIComponent(d.id), body); A.products = A.products.map(p => p.id === d.id ? r : p); }
        else { const r = await api.post('api/products', body); A.products.unshift(r); }
        closeEditor(); renderTab(); refreshShop(); E.toast(d.id ? 'Saved' : 'Product added');
      } catch (e) { fail(e); }
    });
  }
  function closeEditor() { $('#admModal').innerHTML = ''; document.body.classList.remove('adm-lock'); A.ed = null; }

  /* ------------------------------------------------ orders */
  function orders() {
    if (!A.orders.length) return '<div class="adm-empty">No orders yet. When a shopper taps “Order on WhatsApp”, the cart shows up here so you can follow up.</div>';
    return '<div class="adm-orders">' + A.orders.map(o => '<article class="adm-card order ' + o.status + '"><div class="adm-row between"><b>' + fmtDate(o.at) + '</b><select data-ostatus="' + esc(o.id) + '">' +
      [['new', 'New'], ['contacted', 'Contacted'], ['done', 'Done']].map(s => '<option value="' + s[0] + '"' + (o.status === s[0] ? ' selected' : '') + '>' + s[1] + '</option>').join('') + '</select></div>' +
      '<ul>' + o.items.map(i => '<li><span>' + esc(i.name) + ' <small>' + esc(i.spec) + '</small></span><b>' + (i.price ? E.money(i.price) + (i.qty > 1 ? ' × ' + i.qty : '') : 'ask') + '</b></li>').join('') + '</ul>' +
      '<div class="adm-row between"><strong>Total ' + E.money(o.total) + '</strong><button class="adm-btn ghost sm" data-odel="' + esc(o.id) + '">Delete</button></div></article>').join('') + '</div>';
  }

  /* ------------------------------------------------ categories */
  function categories() {
    const cats = A.settings.categories || [];
    return '<p class="muted small">These are the buttons shoppers use to filter products. “All” and “Best Deals” are always there.</p><section class="adm-card"><div id="catList">' +
      cats.map((c, i) => '<div class="adm-cat" data-i="' + i + '"><input value="' + esc(c.label) + '" data-catname="' + i + '" maxlength="30" aria-label="Category name"><small class="muted">' + A.products.filter(p => p.category === c.id).length + ' items</small>' +
        '<button class="adm-btn ghost icon" data-cm="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>▲</button><button class="adm-btn ghost icon" data-cm="down" data-i="' + i + '"' + (i === cats.length - 1 ? ' disabled' : '') + '>▼</button><button class="adm-btn ghost icon del" data-cdel="' + i + '">🗑</button></div>').join('') +
      '</div><div class="adm-row wrap" style="margin-top:12px"><input id="newCat" placeholder="New category, e.g. Laptops" maxlength="30"><button class="adm-btn" data-a="addCat">Add</button></div></section>' +
      '<div class="adm-row"><button class="adm-btn pri" data-a="saveCats">Save categories</button></div>';
  }
  async function saveCats() {
    const cats = A.settings.categories.filter(c => c.label.trim());
    try {
      const r = await api.put('api/settings', { categories: cats.map(c => ({ id: c.id, label: c.label.trim() })) });
      A.settings = r; renderTab(); refreshShop(); E.toast('Categories saved');
    } catch (e) { fail(e); }
  }

  /* ------------------------------------------------ site settings */
  const fld = (k, label, type, hint) => '<label for="s_' + k + '">' + label + (hint ? ' <small class="muted">' + hint + '</small>' : '') + '</label>' +
    (type === 'area' ? '<textarea id="s_' + k + '" data-k="' + k + '" rows="3">' + esc(A.settings[k]) + '</textarea>' : '<input id="s_' + k + '" data-k="' + k + '" value="' + esc(A.settings[k]) + '">');
  const tog = (k, label) => '<label class="chk"><input type="checkbox" data-k="' + k + '"' + (A.settings[k] !== false ? ' checked' : '') + '> ' + label + '</label>';
  function imgField(k, label, hint) {
    const u = A.settings[k];
    return '<label>' + label + ' <small class="muted">' + hint + '</small></label><div class="imgfield"><div class="prev">' + (u ? '<img src="' + esc(u) + '" alt="">' : '<span>Default</span>') + '</div>' +
      '<label class="adm-btn" for="u_' + k + '">Upload</label><input id="u_' + k + '" type="file" accept="image/*" hidden data-up="' + k + '">' + (u ? '<button class="adm-btn ghost" data-a="clr" data-k="' + k + '">Use default</button>' : '') + '</div>';
  }
  function site() {
    const s = A.settings;
    return '<div class="adm-savebar" id="saveBar"><span>You have unsaved changes</span><button class="adm-btn pri" data-a="saveSite">Save changes</button></div>' +
      '<section class="adm-card"><h3>Brand</h3>' + fld('storeName', 'Store name') + fld('tagline', 'Tagline') + imgField('logoUrl', 'Logo', 'Leave as default to keep the animated Elion logo') +
      '<div class="two"><div><label for="s_accent">Accent colour</label><input id="s_accent" data-k="accent" type="color" value="' + esc(s.accent || '#8be44d') + '"></div><div><label for="s_theme">Default theme</label><select id="s_theme" data-k="theme">' +
      [['auto', 'Follow the phone'], ['light', 'Light'], ['dark', 'Dark']].map(o => '<option value="' + o[0] + '"' + (s.theme === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div></div>' +
      '<div class="checks">' + tog('showSplash', 'Show the logo animation on opening') + tog('show3d', 'Show the rotating 3D phone') + tog('showRatings', 'Show star ratings on products') + '</div></section>' +
      '<section class="adm-card"><h3>Home banner</h3>' + fld('heroKicker', 'Small title above') +
      '<div class="two"><div>' + fld('heroLine1', 'Headline, line 1') + '</div><div>' + fld('heroAccent', 'Highlighted word') + '</div></div>' + fld('heroLine2', 'Headline, line 2') + fld('heroText', 'Paragraph', 'area') + fld('heroButton', 'Button text') +
      imgField('heroImage', 'Background photo', 'Wide shop photo works best') + '</section>' +
      '<section class="adm-card"><h3>Scrolling strip and offer box</h3><label for="s_ticker">Strip messages <small class="muted">one per line</small></label><textarea id="s_ticker" data-k="ticker" rows="5">' + esc((s.ticker || []).join('\n')) + '</textarea>' +
      fld('offerTitle', 'Offer title') + fld('offerText', 'Offer text') + fld('offerButton', 'Offer button') + '</section>' +
      '<section class="adm-card"><h3>Contact</h3>' + fld('whatsapp', 'WhatsApp number', '', 'with country code, e.g. 2349061845524') + fld('phone', 'Phone number') + fld('address', 'Shop address') + fld('hours', 'Opening hours') + fld('instagram', 'Instagram or social handle') + fld('footerText', 'Footer text', 'area') + '</section>' +
      '<div class="adm-row"><button class="adm-btn pri" data-a="saveSite">Save changes</button><button class="adm-btn" data-a="view">View store</button></div>';
  }
  function bindSiteDirty() {
    const mark = () => { A.dirty = true; const b = $('#saveBar'); if (b) b.classList.add('show'); };
    $$('#admMain input[data-k], #admMain textarea[data-k], #admMain select[data-k]').forEach(el => el.addEventListener('input', mark));
  }
  async function saveSite(btn) {
    const out = {};
    $$('#admMain input[data-k], #admMain textarea[data-k], #admMain select[data-k]').forEach(el => {
      const k = el.dataset.k;
      if (el.type === 'checkbox') out[k] = el.checked;
      else if (k === 'ticker') out[k] = el.value.split('\n').map(x => x.trim()).filter(Boolean);
      else out[k] = el.value;
    });
    await busy(btn, async () => {
      try { A.settings = await api.put('api/settings', out); A.dirty = false; renderTab(); refreshShop(); E.toast('Site updated'); } catch (e) { fail(e); }
    });
  }
  async function uploadSetting(k, file) {
    if (!file) return;
    try {
      const url = await api.upload(file, { max: k === 'logoUrl' ? 700 : 1800, png: k === 'logoUrl' });
      A.settings = await api.put('api/settings', { [k]: url }); renderTab(); refreshShop(); E.toast('Image updated');
    } catch (e) { fail(e); }
  }

  /* ------------------------------------------------ account */
  function account() {
    return '<section class="adm-card"><h3>Change password</h3><form id="pwForm" autocomplete="off"><label for="pw1">Current password</label><input id="pw1" type="password" autocomplete="current-password" required>' +
      '<label for="pw2">New password <small class="muted">at least 6 characters</small></label><input id="pw2" type="password" autocomplete="new-password" required minlength="6"><button class="adm-btn pri" type="submit">Update password</button></form></section>' +
      '<section class="adm-card"><h3>Backup and restore</h3><p class="muted small">A backup holds your products, categories, settings and orders. Photos you uploaded stay on the server in the data folder.</p>' +
      '<div class="adm-row wrap"><button class="adm-btn" data-a="backup">Download backup</button><button class="adm-btn" data-a="copyBackup">Copy backup text</button><label class="adm-btn" for="restoreFile">Restore from file</label><input id="restoreFile" type="file" accept="application/json,.json" hidden></div></section>' +
      (E.isDemo() ? '<section class="adm-card"><h3>Preview data</h3><p class="muted small">Put the sample products back the way they were.</p><button class="adm-btn" data-a="resetDemo">Reset preview data</button></section>' : '');
  }
  async function backup(copy) {
    try {
      let text;
      if (E.isDemo()) text = JSON.stringify(await api.get('api/backup'), null, 1);
      else { const r = await fetch('api/backup', { headers: { Authorization: 'Bearer ' + localStorage.getItem('elion_token') } }); if (!r.ok) throw new Error('Could not create backup'); text = await r.text(); }
      if (copy) { try { await navigator.clipboard.writeText(text); E.toast('Backup copied'); } catch (e) { E.toast('Copy is blocked here. Use Download.', true); } return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = 'elion-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove(); E.toast('Backup downloaded');
    } catch (e) { fail(e); }
  }
  async function restore(file) {
    if (!file) return;
    try { const data = JSON.parse(await file.text()); const r = await api.post('api/restore', data); await loadAll(); renderShell(); refreshShop(); E.toast('Restored ' + r.products + ' products'); }
    catch (e) { fail(e.name === 'SyntaxError' ? new Error('That file is not a valid backup') : e); }
  }

  /* ------------------------------------------------ events */
  function bind() {
    const R = root();
    R.addEventListener('submit', e => {
      e.preventDefault();
      if (e.target.id === 'loginForm') doLogin(e.target);
      else if (e.target.id === 'pwForm') {
        api.post('api/password', { current: $('#pw1').value, next: $('#pw2').value }).then(() => { A.isDefault = false; e.target.reset(); E.toast('Password updated'); }).catch(fail);
      }
    });
    document.addEventListener('submit', e => { if (e.target.id === 'edForm') { e.preventDefault(); saveProduct(e.target); } });
    document.addEventListener('click', async e => {
      if ($('#admin').hidden) return;
      const t = e.target.closest('[data-a],[data-tab],[data-edit],[data-mv],[data-del],[data-ph],[data-cm],[data-cdel],[data-odel]'); if (!t) { if (e.target.id === 'edModal') closeEditor(); return; }
      const d = t.dataset;
      if (d.tab) { A.tab = d.tab; renderTab(); window.scrollTo(0, 0); }
      else if (d.edit) openEditor(d.edit);
      else if (d.mv) move(d.id, d.mv);
      else if (d.del) del(t, d.del);
      else if (d.ph) { const i = +d.i; if (d.ph === 'rm') A.ed.images.splice(i, 1); else A.ed.images.unshift(A.ed.images.splice(i, 1)[0]); renderPhotos(); }
      else if (d.cm) { const c = A.settings.categories, i = +d.i, j = i + (d.cm === 'up' ? -1 : 1); [c[i], c[j]] = [c[j], c[i]]; renderTab(); }
      else if (d.cdel) { A.settings.categories.splice(+d.cdel, 1); renderTab(); }
      else if (d.odel) { try { await api.del('api/orders/' + d.odel); A.orders = A.orders.filter(o => o.id !== d.odel); renderTab(); E.toast('Order deleted'); } catch (x) { fail(x); } }
      else switch (d.a) {
        case 'view': E.closeAdmin(); break;
        case 'theme': E.toggleTheme(); break;
        case 'logout': api.setToken(null); renderLogin(); break;
        case 'add': openEditor(); break;
        case 'closeEd': closeEditor(); break;
        case 'addCat': { const el = $('#newCat'), v = el.value.trim(); if (!v) return; let id = E.slug(v), n = 1; while (A.settings.categories.some(c => c.id === id)) id = E.slug(v) + '-' + (++n); A.settings.categories.push({ id, label: v }); renderTab(); break; }
        case 'saveCats': saveCats(); break;
        case 'saveSite': saveSite(t); break;
        case 'clr': { const k = d.k; try { A.settings = await api.put('api/settings', { [k]: '' }); renderTab(); refreshShop(); E.toast('Back to default'); } catch (x) { fail(x); } break; }
        case 'backup': backup(false); break;
        case 'copyBackup': backup(true); break;
        case 'resetDemo': try { await api.post('api/reset-demo'); await loadAll(); renderShell(); refreshShop(); E.toast('Preview data reset'); } catch (x) { fail(x); } break;
      }
    });
    document.addEventListener('change', async e => {
      if ($('#admin').hidden) return; const t = e.target;
      if (t.dataset.stock) { const p = A.products.find(x => x.id === t.dataset.stock); try { const r = await api.put('api/products/' + encodeURIComponent(p.id), Object.assign({}, p, { inStock: t.checked })); Object.assign(p, r); renderTab(); refreshShop(); E.toast(t.checked ? 'Marked in stock' : 'Marked sold out'); } catch (x) { fail(x); t.checked = !t.checked; } }
      else if (t.dataset.ostatus) { try { await api.patch('api/orders/' + t.dataset.ostatus, { status: t.value }); const o = A.orders.find(x => x.id === t.dataset.ostatus); o.status = t.value; renderTab(); const b = $('.adm-tabs [data-tab=orders]'); } catch (x) { fail(x); } }
      else if (t.dataset.up) uploadSetting(t.dataset.up, t.files[0]);
      else if (t.id === 'restoreFile') restore(t.files[0]);
      else if (t.id === 'pc') { A.fcat = t.value; renderTab(); }
      else if (t.dataset.catname !== undefined) { A.settings.categories[+t.dataset.catname].label = t.value; }
    });
    document.addEventListener('input', e => {
      if ($('#admin').hidden) return;
      if (e.target.id === 'pf') { A.filter = e.target.value; const pos = e.target.selectionStart; renderTab(); const el = $('#pf'); el.focus(); el.setSelectionRange(pos, pos); }
      else if (e.target.dataset.catname !== undefined) A.settings.categories[+e.target.dataset.catname].label = e.target.value;
    });
    // drag and drop photos onto the editor
    document.addEventListener('dragover', e => { if (A.ed && e.target.closest('#photos')) e.preventDefault(); });
    document.addEventListener('drop', e => { if (A.ed && e.target.closest('#photos')) { e.preventDefault(); addFiles(e.dataTransfer.files); } });
    window.addEventListener('beforeunload', e => { if (A.dirty && !$('#admin').hidden) { e.preventDefault(); e.returnValue = ''; } });
  }
})();

</script>
<script>
/* Start-up: pick server or demo data, run the logo intro, show the shop or the admin. */
(function () {
  'use strict';
  const E = window.Elion, $ = E.$;
  const isAdminRoute = () => /\/admin\/?$/.test(location.pathname) || location.hash === '#admin';

  /* ---- logo intro ---- */
  const splash = $('#splash');
  let splashDone = false;
  function endSplash() {
    if (splashDone) return; splashDone = true;
    splash.classList.add('out');
    setTimeout(() => splash.remove(), 900);
  }
  function runSplash() {
    let seen = false; try { seen = sessionStorage.getItem('elion_splash') === '1'; } catch (e) {}
    if (isAdminRoute() || seen) { splash.remove(); splashDone = true; return; }
    try { sessionStorage.setItem('elion_splash', '1'); } catch (e) {}
    const imgs = Array.from(splash.querySelectorAll('img'));
    const ready = Promise.all(imgs.map(i => i.decode ? i.decode().catch(() => {}) : Promise.resolve()));
    const start = () => splash.classList.add('go');
    Promise.race([ready, new Promise(r => setTimeout(r, 1200))]).then(start);
    splash.addEventListener('click', endSplash);
    setTimeout(endSplash, 3900);
  }
  runSplash();

  /* ---- routing ---- */
  function route() {
    const admin = isAdminRoute();
    document.documentElement.classList.toggle('is-admin', admin);
    $('#admin').hidden = !admin;
    if (admin) { E.admin.mount(); window.scrollTo(0, 0); }
  }
  E.openAdmin = () => { if (/\/admin\/?$/.test(location.pathname)) { route(); } else { location.hash = '#admin'; } };
  E.closeAdmin = () => {
    if (/\/admin\/?$/.test(location.pathname)) { location.href = './'; return; }
    history.replaceState(null, '', location.pathname + location.search); route();
  };
  window.addEventListener('hashchange', route);

  /* ---- load ---- */
  E.reloadStore = async () => { const data = await E.api.get('api/store'); E.shop.load(data); return data; };
  (async function () {
    $('#grid').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    await E.api.detect();
    let data;
    try { data = await E.api.get('api/store'); }
    catch (e) { $('#grid').innerHTML = ''; $('#empty').style.display = 'block'; $('#empty').textContent = 'Could not load products. Please refresh.'; endSplash(); return; }
    E.applyDefaultTheme(data.settings);
    E.settings = data.settings;
    E.shop.bind(); E.shop.load(data);
    if (data.settings.showSplash === false) endSplash();
    try { if (!sessionStorage.getItem('elion_visit')) { sessionStorage.setItem('elion_visit', '1'); E.api.post('api/visit').catch(() => {}); } } catch (e) {}
    route();
    if ('serviceWorker' in navigator && false) navigator.serviceWorker.register('sw.js');
  })();
})();

</script>
</body>
</html>
