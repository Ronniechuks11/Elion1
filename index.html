<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111511">
<meta name="description" content="Elion Phones: genuine phones, tablets and accessories with real photos and clear prices.">
<title>Elion Phones</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
/* set the theme before first paint so there is no flash */
(function () {
  try {
    var t = localStorage.getItem('elion_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
  if (/(^|\/)admin$|#admin/.test(location.pathname + location.hash)) document.documentElement.classList.add('is-admin');
})();
</script>
<style>
/* Elion Phones storefront. Same layout and look as the original store, with a light and a dark theme. */
:root{
  --bg:#f5f6f5;--surface:#fff;--surface2:#f2f3f1;--text:#171a17;--muted:#666;--muted2:#777;
  --line:#e5e8e3;--line2:#e1e5df;--field:#fafafa;
  --btn:#151915;--btn-text:#fff;--btn-b:#8be44d;
  --accent:#8be44d;--accent-text:#4b932b;--accent-soft:#eef8e9;--on-accent:#111;
  --menu:#111611;--footer:#111611;--shadow:#0001;--shadow2:#00000009;
  --hero-grad:linear-gradient(90deg,rgba(248,249,247,.98),rgba(248,249,247,.80) 40%,rgba(248,249,247,.15));
  --hero-fade:#f5f6f5;--hero-p:#4b514b;--danger:#d93025;--ok:#16b95c;--star:#e4a400;
  --logo-filter:none;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090b09;--surface:#131713;--surface2:#1b201b;--text:#eef2ec;--muted:#9ba49a;--muted2:#8a938a;
  --line:#242a24;--line2:#2c332c;--field:#0f120f;
  --btn:#8be44d;--btn-text:#0a0c0a;--btn-b:#0a0c0a;
  --accent-text:#8be44d;--accent-soft:#1d2a17;
  --menu:#0e120e;--footer:#0e120e;--shadow:#0008;--shadow2:#0005;
  --hero-grad:linear-gradient(90deg,rgba(9,11,9,.96),rgba(9,11,9,.80) 42%,rgba(9,11,9,.35));
  --hero-fade:#090b09;--hero-p:#b3bbb2;--logo-filter:brightness(0) invert(1);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090b09;--surface:#131713;--surface2:#1b201b;--text:#eef2ec;--muted:#9ba49a;--muted2:#8a938a;
  --line:#242a24;--line2:#2c332c;--field:#0f120f;
  --btn:#8be44d;--btn-text:#0a0c0a;--btn-b:#0a0c0a;
  --accent-text:#8be44d;--accent-soft:#1d2a17;
  --menu:#0e120e;--footer:#0e120e;--shadow:#0008;--shadow2:#0005;
  --hero-grad:linear-gradient(90deg,rgba(9,11,9,.96),rgba(9,11,9,.80) 42%,rgba(9,11,9,.35));
  --hero-fade:#090b09;--hero-p:#b3bbb2;--logo-filter:brightness(0) invert(1);
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;padding-bottom:70px;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.is-admin #shop{display:none}

/* ---- logo intro ---- */
.splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  background:radial-gradient(120% 90% at 50% 40%,#0b1a3c 0%,#050913 55%,#030508 100%);overflow:hidden}
.splash.out{animation:splashOut .75s cubic-bezier(.7,0,.2,1) forwards}
@keyframes splashOut{to{opacity:0;transform:scale(1.06);visibility:hidden}}
.splash-glow{position:absolute;width:70vmin;height:70vmin;border-radius:50%;background:radial-gradient(circle,rgba(139,228,77,.22),rgba(139,228,77,0) 62%);opacity:0;transform:scale(.4)}
.sl{position:relative;width:min(78vw,430px);aspect-ratio:729/433}
.sl-l{position:absolute;inset:0;width:100%;height:100%;filter:brightness(0) invert(1);opacity:0;will-change:transform,opacity}
.sl-tag,.sl-arc{filter:brightness(0) invert(1) opacity(.62)}
.sl-arc{filter:brightness(0) invert(1) drop-shadow(0 0 6px rgba(139,228,77,.9))}
.sl-bar{width:min(46vw,190px);height:3px;border-radius:3px;background:#ffffff1c;overflow:hidden;opacity:0}
.sl-bar i{display:block;height:100%;width:100%;background:var(--accent);transform:translateX(-100%)}
.splash.go .splash-glow{animation:glow 2.4s ease-out .1s forwards}
.splash.go .sl-phone{animation:phoneIn .85s cubic-bezier(.2,1.3,.4,1) .15s forwards}
.splash.go .sl-eli{animation:fromL .8s cubic-bezier(.2,.9,.2,1) .5s forwards}
.splash.go .sl-n{animation:fromR .8s cubic-bezier(.2,.9,.2,1) .5s forwards}
.splash.go .sl-arc{animation:arcDraw .75s cubic-bezier(.5,0,.2,1) 1.05s forwards}
.splash.go .sl-tag{animation:tagIn .8s ease-out 1.35s forwards}
.splash.go .sl-bar{animation:fadeIn .3s 1.2s forwards}
.splash.go .sl-bar i{animation:barRun 1.2s cubic-bezier(.5,0,.2,1) 1.3s forwards}
@keyframes glow{0%{opacity:0;transform:scale(.4)}40%{opacity:1}100%{opacity:.75;transform:scale(1.15)}}
@keyframes phoneIn{0%{opacity:0;transform:translateY(46px) scale(.35);filter:brightness(0) invert(1) blur(8px)}100%{opacity:1;transform:none;filter:brightness(0) invert(1) blur(0)}}
@keyframes fromL{0%{opacity:0;transform:translateX(-70px)}100%{opacity:1;transform:none}}
@keyframes fromR{0%{opacity:0;transform:translateX(70px)}100%{opacity:1;transform:none}}
@keyframes arcDraw{0%{opacity:1;clip-path:inset(0 100% 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes tagIn{0%{opacity:0;transform:scaleX(.7) translateY(8px)}100%{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@keyframes barRun{to{transform:translateX(0)}}

/* ---- top bar and nav ---- */
.top{height:5px;background:var(--accent)}
.nav{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 12px var(--shadow);transition:background .25s}
.navrow{height:63px;display:flex;align-items:center;gap:8px;padding:7px 11px;max-width:1100px;margin:auto}
.menu,.icon{border:0;background:transparent;font-size:24px;width:37px;height:40px;flex:none;color:var(--text)}
.logoLink{display:block;flex:none;line-height:0}
.logo{height:30px;width:auto;max-width:120px;object-fit:contain;filter:var(--logo-filter)}
.logo.custom{filter:none;background:#fff;border-radius:8px;padding:3px;height:40px;max-width:100px}
.search{height:40px;flex:1;min-width:0;max-width:680px;margin-right:auto;border:2px solid var(--btn);border-radius:22px;display:flex;overflow:hidden;background:var(--field)}
:root[data-theme="dark"] .search{border-color:var(--line2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .search{border-color:var(--line2)}}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;padding:0 13px;font-size:13px;-webkit-appearance:none}
.search button{width:46px;border:0;background:var(--btn);color:var(--btn-text);font-size:17px;flex:none}
.cartIcon{position:relative}
.count{position:absolute;right:-1px;top:0;background:var(--accent);color:var(--on-accent);border-radius:50%;min-width:17px;height:17px;font-size:9px;display:grid;place-items:center;font-weight:900;transition:transform .2s}
.count.bump{transform:scale(1.4)}
.themeBtn{font-size:20px;position:relative}
.themeBtn .ico-moon{display:none}
:root[data-theme="dark"] .themeBtn .ico-sun{display:none}
:root[data-theme="dark"] .themeBtn .ico-moon{display:inline}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .themeBtn .ico-sun{display:none}
  :root:not([data-theme="light"]) .themeBtn .ico-moon{display:inline}}
.menuPanel{display:none;background:var(--menu);color:#fff;padding:10px 15px}
.menuPanel.open{display:block}
.menuPanel div{padding:13px 0;border-bottom:1px solid #303630;font-size:13px;font-weight:800;cursor:pointer}
@media (max-width:440px){.navrow{gap:4px;padding:7px 8px}.logo{height:25px;max-width:96px}.menu,.icon{width:33px}.search button{width:40px}.search input{padding:0 10px}}

/* ---- hero ---- */
.hero{position:relative;min-height:540px;background-color:var(--hero-fade);background-size:cover;background-position:center;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:var(--hero-grad);z-index:-1}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--hero-fade));z-index:-1;opacity:.0}
.heroText{padding:32px 18px 35px;max-width:360px;position:relative;z-index:2}
.kicker{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--accent-text)}
.hero h1{font-size:42px;line-height:.94;margin:8px 0 12px;letter-spacing:-2px}
.hero h1 span{color:var(--accent-text)}
.hero p{font-size:13px;line-height:1.5;color:var(--hero-p);max-width:270px;margin:0 0 16px}
.heroBtn{border:0;background:var(--btn);color:var(--btn-text);padding:12px 17px;border-radius:8px;font-weight:900}
.heroBtn b{color:var(--btn-b)}
.heroPhone{position:absolute;right:2px;top:2px;width:150px;height:260px;z-index:1;pointer-events:none}
.heroPhone .stage{pointer-events:auto;touch-action:pan-y;cursor:grab}
.no3d .heroPhone{display:none}

/* ---- 3D phone ---- */
.stage{position:relative;width:100%;height:100%;perspective:1100px}
.phone{position:absolute;left:50%;top:48%;width:150px;height:312px;margin:-156px 0 0 -75px;transform-style:preserve-3d;transform:rotateX(-7deg) rotateY(var(--ry,-28deg)) scale(.74);will-change:transform}
.face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{transform:translateZ(7px);background:#050607;border:3px solid #6f7783;box-shadow:inset 0 0 0 2px #14171b}
.back{transform:rotateY(180deg) translateZ(7px);background:linear-gradient(150deg,#e4e8ee 0%,#a9b1bd 38%,#cfd5dd 60%,#8d96a3 100%);border:3px solid #7d8591;overflow:hidden}
.back::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.55),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 65%,rgba(255,255,255,.25));pointer-events:none}
.rim{position:absolute;inset:0;border-radius:30px;border:3px solid #7d8591;background:#20242a}
.screen{position:absolute;inset:6px;border-radius:24px;overflow:hidden;background:#000}
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.08);transition:opacity .9s ease,transform 4s ease}
.slide.on{opacity:1;transform:scale(1)}
.shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,0) 28%,rgba(0,0,0,0) 55%,rgba(0,0,0,.82))}
.status{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff;font-size:9px}
.status b{font-weight:700}
.island{position:absolute;left:50%;top:6px;width:44px;height:12px;margin-left:-22px;background:#000;border-radius:10px}
.batt{width:14px;height:7px;border:1px solid #fff;border-radius:2px;position:relative}
.batt::after{content:"";position:absolute;inset:1px 3px 1px 1px;background:var(--accent);border-radius:1px}
.cap{position:absolute;left:11px;right:11px;bottom:20px;color:#fff;display:flex;flex-direction:column;gap:2px}
.cap small{font-size:7px;letter-spacing:2px;color:var(--accent);font-weight:900}
.cap strong{font-size:13px;line-height:1.15}
.cap em{font-style:normal;font-size:11px;font-weight:900;color:var(--accent)}
.home{position:absolute;left:50%;bottom:6px;width:46px;height:3px;margin-left:-23px;background:#fffc;border-radius:3px}
.cam{position:absolute;left:11px;top:11px;width:66px;height:66px;border-radius:18px;background:rgba(40,46,56,.55);border:2px solid rgba(255,255,255,.35);box-shadow:inset 0 0 8px #0006}
.cam i{position:absolute;width:25px;height:25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a5a78 0,#10151f 45%,#05070a 70%);border:2px solid #9aa3b0}
.cam i:nth-child(1){left:6px;top:6px}.cam i:nth-child(2){left:6px;top:34px}.cam i:nth-child(3){left:34px;top:20px}
.cam u{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:#fff6c9;box-shadow:0 0 6px #fff}
.mark{position:absolute;left:0;right:0;top:52%;text-align:center;color:#2a3140;display:flex;flex-direction:column;gap:3px;align-items:center}
.mark b{font-size:19px;letter-spacing:5px;text-shadow:0 1px 0 #ffffff99}
.mark small{font-size:5px;letter-spacing:2px;opacity:.7}
.floor{position:absolute;left:50%;bottom:6px;width:120px;height:20px;margin-left:-60px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);filter:blur(4px)}

/* ---- ticker, categories, offer ---- */
.ticker{height:34px;background:var(--btn);color:var(--btn-text);overflow:hidden;white-space:nowrap;display:flex;align-items:center;font-size:10px;font-weight:900}
.track{display:inline-flex;gap:38px;animation:slide 22s linear infinite;padding-left:38px}
.track span{display:inline-block}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.container{max-width:1100px;margin:auto}
.section{padding:22px 13px 5px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.head h2{font-size:21px;margin:0}
.see{font-size:12px;font-weight:900;color:var(--accent-text);cursor:pointer}
.categories{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding-bottom:2px}
.categories::-webkit-scrollbar{display:none}
.cat,.chip{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 13px;font-size:11px;font-weight:900;white-space:nowrap;transition:.15s}
.cat.active{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.offer{margin:14px 13px;background:var(--btn);color:var(--btn-text);border-radius:13px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.offer strong{font-size:17px}
.offer small{display:block;opacity:.7;margin-top:4px}
.offer button{border:0;background:var(--accent);color:var(--on-accent);border-radius:7px;padding:9px 11px;font-size:11px;font-weight:900;flex:none}
:root[data-theme="dark"] .offer{background:var(--surface2);color:var(--text);border:1px solid var(--line2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .offer{background:var(--surface2);color:var(--text);border:1px solid var(--line2)}}

.sortRow{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:11px;font-weight:900;color:var(--muted)}
.sortRow select{flex:1;max-width:210px;min-width:0;height:34px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);padding:0 8px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.chip{padding:8px 11px;margin-left:auto}

/* ---- product grid ---- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.product{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 2px 10px var(--shadow2);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.product:hover{transform:translateY(-2px)}
.photo{height:190px;background:var(--surface2);position:relative;overflow:hidden;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;transition:transform .35s;display:block}
.product:hover .photo img{transform:scale(1.04)}
.stock{position:absolute;right:7px;top:8px;background:var(--ok);color:#fff;padding:5px 7px;border-radius:8px;font-size:9px;font-weight:900;z-index:2}
.stock.out{background:var(--danger)}
.fav{position:absolute;left:7px;top:7px;border:0;background:#ffffffdd;color:#222;border-radius:50%;width:31px;height:31px;font-size:21px;z-index:3;line-height:1;padding:0}
.fav.on{color:#e11}
.info{padding:10px;display:flex;flex-direction:column;flex:1}
.tag{font-size:8px;font-weight:900;background:var(--accent-soft);color:var(--accent-text);padding:4px 6px;border-radius:5px;align-self:flex-start}
.info h3{font-size:13px;margin:7px 0 3px;line-height:1.2}
.info p{font-size:10px;color:var(--muted);margin:0;min-height:24px;line-height:1.35}
.stars{color:var(--star);font-size:10px;margin:7px 0}
.stars small{color:var(--muted2);margin-left:3px}
.priceRow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.priceRow strong{font-size:15px}
.priceRow strong.ask{font-size:12px;color:var(--accent-text)}
.priceRow s{display:block;font-size:10px;color:var(--muted2);font-weight:400}
.cartBtn{width:35px;height:35px;border:0;border-radius:50%;background:var(--btn);color:var(--btn-text);font-size:16px;flex:none;transition:transform .15s}
.cartBtn:active{transform:scale(.9)}
.cartBtn:disabled{opacity:.35;cursor:not-allowed}
.empty{text-align:center;padding:35px;color:var(--muted2);display:none}
.skel{height:300px;border-radius:13px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---- bottom nav + whatsapp ---- */
.bottom{position:fixed;bottom:0;left:0;right:0;height:67px;background:var(--surface);border-top:1px solid var(--line);z-index:120;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -5px 20px var(--shadow);padding-bottom:env(safe-area-inset-bottom,0)}
.bottom button{border:0;background:transparent;color:var(--muted);font-size:9px;font-weight:800}
.bottom b{display:block;font-size:20px;margin-bottom:2px}
.bottom .active{color:var(--accent-text)}
.whats{position:fixed;right:14px;bottom:78px;width:48px;height:48px;border:0;border-radius:50%;background:#20c768;color:#fff;z-index:110;box-shadow:0 6px 18px #0003;display:grid;place-items:center;padding:0}
.whats::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #20c768;animation:ping 2.4s infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}

/* ---- drawers, sheet, zoom ---- */
.drawer{position:fixed;inset:0;background:#0007;z-index:300;display:none;align-items:flex-end;backdrop-filter:blur(2px)}
.drawer.open{display:flex}
.panel{width:100%;max-height:86vh;background:var(--surface);border-radius:20px 20px 0 0;padding:17px;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.panelHead{display:flex;align-items:center;justify-content:space-between}
.panelHead h2{margin:0}
.close{border:0;background:var(--surface2);border-radius:50%;width:33px;height:33px;font-size:20px;line-height:1;padding:0}
.cartItem{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cartItem img{width:65px;height:65px;border-radius:8px;object-fit:cover}
.cartItem h4{margin:2px 0;font-size:13px}
.cartItem p{margin:4px 0;font-size:10px;color:var(--muted2)}
.cartItem .qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:var(--surface2);padding:0;font-size:15px;line-height:1}
.qty span{min-width:18px;text-align:center;font-weight:900;font-size:13px}
.rm{border:0;background:transparent;color:var(--danger);font-size:11px;font-weight:900;margin-left:auto;align-self:flex-start;padding:4px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:900;margin-top:15px}
.checkout{width:100%;margin-top:12px;padding:13px;border:0;border-radius:9px;background:var(--btn);color:var(--btn-text);font-weight:900}
.cartEmpty{text-align:center;color:var(--muted2);padding:30px}
.sheetWrap{align-items:flex-end;justify-content:center}
.sheet{padding:0;max-width:640px;position:relative}
.galWrap{position:relative}
.gal{position:relative;background:var(--surface2);height:min(62vh,440px);display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;cursor:zoom-in;background:var(--surface2)}
.sheet .close{position:absolute;right:12px;top:12px;z-index:5;background:#fffe;color:#111;box-shadow:0 2px 8px #0003}
.sheetBody{padding:16px 18px 20px}
.sheetBody h2{margin:8px 0 4px;font-size:21px}

  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  E.$ = $; E.$$ = $$;
  E.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  E.money = (n, cur) => (cur || (E.settings && E.settings.currency) || '₦') + Number(n || 0).toLocaleString('en-NG');
  E.store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
  E.slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';

  /* ---------- toast ---------- */
  E.toast = (t, err) => {
    const box = $('#toastBox'); if (!box) return;
    const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = t;
    box.appendChild(d); setTimeout(() => d.remove(), 2700);
  };

  /* ---------- theme ---------- */
  E.theme = () => {
    const t = document.documentElement.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  };
  E.setTheme = t => {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('elion_theme', t); } catch (e) {}
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'dark' ? '#090b09' : '#111511';
  };
  E.toggleTheme = () => E.setTheme(E.theme() === 'dark' ? 'light' : 'dark');
  E.applyDefaultTheme = s => {
    let saved = null; try { saved = localStorage.getItem('elion_theme'); } catch (e) {}
    if (!saved && s && (s.theme === 'light' || s.theme === 'dark')) document.documentElement.setAttribute('data-theme', s.theme);
  };

  /* ---------- image compression before upload ---------- */
  E.compress = async (file, max, keepPng) => {
    max = max || 1400;
    if (!/^image\//.test(file.type)) throw new Error('Please choose an image file');
    if (file.type === 'image/gif') return file;
    let bmp;
    try { bmp = await createImageBitmap(file); }
    catch (e) { return file; }
    const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * r), h = Math.round(bmp.height * r);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    const png = keepPng && file.type === 'image/png';
    if (!png) { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); }
    g.drawImage(bmp, 0, 0, w, h);
    return await new Promise(res => c.toBlob(b => res(b || file), png ? 'image/png' : 'image/jpeg', 0.86));
  };

  /* ---------- data layer ---------- */
  const API = E.api = { mode: 'server' };
  let token = null; try { token = localStorage.getItem('elion_token'); } catch (e) {}
  API.hasToken = () => !!token;
  API.setToken = t => { token = t; try { t ? localStorage.setItem('elion_token', t) : localStorage.removeItem('elion_token'); } catch (e) {} };

  async function http(method, url, body, raw) {
    const h = {};
    if (token) h.Authorization = 'Bearer ' + token;
    let payload;
    if (raw) { payload = raw; h['Content-Type'] = raw.type || 'application/octet-stream'; }
    else if (body !== undefined) { payload = JSON.stringify(body); h['Content-Type'] = 'application/json'; }
    const r = await fetch(url, { method, headers: h, body: payload, cache: 'no-store' });
    let data = null; try { data = await r.json(); } catch (e) {}
    if (!r.ok) {
      if (r.status === 401 && token && url !== 'api/login') { API.setToken(null); E.onLoggedOut && E.onLoggedOut(); }
      throw Object.assign(new Error((data && data.error) || 'Something went wrong'), { status: r.status });
    }
    return data;
  }

  /* --- demo backend: same endpoints, stored in this browser (IndexedDB). Used when there is no server. --- */
  const Demo = (() => {
    let state = null, authState = null;
    const idb = () => new Promise((res, rej) => {
      const q = indexedDB.open('elion-demo', 1);
      q.onupgradeneeded = () => q.result.createObjectStore('kv');
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
    const kv = async (k, v) => {
      try {
        const db = await idb();
        return await new Promise((res, rej) => {
          const t = db.transaction('kv', v === undefined ? 'readonly' : 'readwrite'); const s = t.objectStore('kv');
          const q = v === undefined ? s.get(k) : s.put(v, k);
          q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
        });
      } catch (e) { return null; }
    };
    const sha = async s => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('elion|' + s)))).map(b => b.toString(16).padStart(2, '0')).join('');
    const save = () => kv('db', state);
    async function init() {
      if (state) return;
      state = await kv('db');
      if (!state) {
        const r = await fetch('data/seed.json'); state = await r.json(); state.visits = {};
        await save();
      }
      authState = (await kv('auth')) || { hash: await sha('elion2026'), isDefault: true };
    }
    const num = v => { v = Number(v); return Number.isFinite(v) && v >= 0 ? Math.round(v) : 0; };
    const clean = (b, p) => {
      p = p || {};
      return {
        id: p.id, name: String(b.name || '').slice(0, 120).trim() || 'Untitled product', spec: String(b.spec || '').slice(0, 200),
        price: num(b.price), oldPrice: num(b.oldPrice), category: String(b.category || 'other').slice(0, 40), tag: String(b.tag || '').slice(0, 24),
        inStock: b.inStock !== false, featured: !!b.featured, deal: !!b.deal, rating: Math.min(5, Math.max(0, Number(b.rating) || 0)),
        images: (Array.isArray(b.images) ? b.images : p.images || []).filter(Boolean).slice(0, 8),
        order: Number.isFinite(Number(b.order)) ? Number(b.order) : (p.order != null ? p.order : state.products.length)
      };
    };
    const today = () => new Date().toISOString().slice(0, 10);
    const renum = () => { state.products.sort((a, b) => a.order - b.order).forEach((x, i) => x.order = i); };
    const bad = (m, s) => { throw Object.assign(new Error(m), { status: s || 400 }); };
    const needAdmin = () => { if (token !== 'demo-admin') bad('Please log in', 401); };

    return async function (method, url, body, raw) {
      await init();
      const p = url.split('?')[0].replace(/^\/?/, '/');
      let m;
      if (method === 'GET' && p === '/api/store') return { products: state.products.slice().sort((a, b) => a.order - b.order), settings: state.settings };
      if (method === 'POST' && p === '/api/visit') { const d = today(); state.visits[d] = (state.visits[d] || 0) + 1; await save(); return { ok: true }; }
      if (method === 'POST' && p === '/api/orders') {
        const items = (body.items || []).map(i => ({ name: i.name, spec: i.spec, price: num(i.price), qty: Math.max(1, num(i.qty) || 1) }));
        const o = { id: 'o' + Date.now().toString(36), at: new Date().toISOString(), items, total: items.reduce((s, i) => s + i.price * i.qty, 0), status: 'new', note: '' };
        state.orders.unshift(o); await save(); return { ok: true, id: o.id };
      }
      if (method === 'POST' && p === '/api/login') {
        if ((await sha(body.password || '')) !== authState.hash) bad('Wrong password', 401);
        return { token: 'demo-admin', isDefaultPassword: !!authState.isDefault };
      }
      needAdmin();
      if (p === '/api/me') return { ok: true, isDefaultPassword: !!authState.isDefault };
      if (p === '/api/stats') {
        const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); days.push({ day: d, visits: state.visits[d] || 0 }); }
        return { products: state.products.length, inStock: state.products.filter(x => x.inStock).length, orders: state.orders.length, newOrders: state.orders.filter(o => o.status === 'new').length, stockValue: state.products.filter(x => x.inStock).reduce((s, x) => s + x.price, 0), days };
      }
      if (method === 'GET' && p === '/api/orders') return { orders: state.orders };
      if ((m = p.match(/^\/api\/orders\/([\w-]+)$/))) {
        const o = state.orders.find(x => x.id === m[1]); if (!o) bad('Not found', 404);
        if (method === 'PATCH') { if (['new', 'contacted', 'done'].includes(body.status)) o.status = body.status; if ('note' in body) o.note = String(body.note || '').slice(0, 300); await save(); return o; }
        if (method === 'DELETE') { state.orders = state.orders.filter(x => x !== o); await save(); return { ok: true }; }
      }
      if (method === 'POST' && p === '/api/products') {
        const prod = clean(body); prod.order = -1; let id = E.slug(prod.name), n = 1;
        while (state.products.some(x => x.id === id)) id = E.slug(prod.name) + '-' + (++n);
        prod.id = id; state.products.unshift(prod); renum(); await save(); return prod;
      }
      if (method === 'POST' && p === '/api/products/reorder') {
        (body.ids || []).forEach((id, i) => { const x = state.products.find(q => q.id === id); if (x) x.order = i; });
        renum(); await save(); return { ok: true };
      }
      if ((m = p.match(/^\/api\/products\/([\w-]+)$/))) {
        const i = state.products.findIndex(x => x.id === m[1]); if (i < 0) bad('Not found', 404);
        if (method === 'PUT') { state.products[i] = clean(body, state.products[i]); await save(); return state.products[i]; }
        if (method === 'DELETE') { state.products.splice(i, 1); renum(); await save(); return { ok: true }; }
      }
      if (method === 'PUT' && p === '/api/settings') {
        const out = Object.assign({}, body);
        if ('whatsapp' in out) out.whatsapp = String(out.whatsapp || '').replace(/\D/g, '');
        Object.assign(state.settings, out); await save(); return state.settings;
      }
      if (method === 'POST' && p === '/api/upload') {
        const url2 = await new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(raw); });
        return { url: url2 };
      }
      if (method === 'POST' && p === '/api/password') {
        if ((await sha(body.current || '')) !== authState.hash) bad('Current password is wrong');
        if (String(body.next || '').length < 6) bad('New password must be at least 6 characters');
        authState = { hash: await sha(body.next), isDefault: false }; await kv('auth', authState); return { ok: true };
      }
      if (method === 'GET' && p === '/api/backup') return { products: state.products, settings: state.settings, orders: state.orders };
      if (method === 'POST' && p === '/api/restore') {
        if (!Array.isArray(body.products)) bad('This is not an Elion backup file');
        state.products = body.products.map((x, i) => { const c = clean(x, { id: E.slug(x.id || x.name), order: i }); c.id = E.slug(x.id || x.name); c.order = i; return c; });
        if (body.settings) Object.assign(state.settings, body.settings);
        if (Array.isArray(body.orders)) state.orders = body.orders;
        await save(); return { ok: true, products: state.products.length };
      }
      if (method === 'POST' && p === '/api/reset-demo') {
        const r = await fetch('data/seed.json'); state = await r.json(); state.visits = {}; await save(); return { ok: true };
      }
      bad('Not found', 404);
    };
  })();

  API.req = (method, url, body, raw) => API.mode === 'demo' ? Demo(method, url, body, raw) : http(method, url, body, raw);
  API.get = u => API.req('GET', u);
  API.post = (u, b) => API.req('POST', u, b || {});
  API.put = (u, b) => API.req('PUT', u, b || {});
  API.patch = (u, b) => API.req('PATCH', u, b || {});
  API.del = u => API.req('DELETE', u);
  API.upload = async (file, opts) => {
    const blob = await E.compress(file, (opts && opts.max) || 1400, opts && opts.png);
    const r = await API.req('POST', 'api/upload', undefined, blob);
    return r.url;
  };
  API.detect = async () => {
    try {
      const r = await fetch('api/store', { cache: 'no-store' });
      const ct = r.headers.get('content-type') || '';
      if (r.ok && ct.indexOf('json') > -1) { API.mode = 'server'; return 'server'; }
    } catch (e) {}
    API.mode = 'demo'; return 'demo';
  };
  E.isDemo = () => API.mode === 'demo';
})();

</script>
<script>
/* Rotating 3D phone in the hero. Pure CSS 3D, driven by one requestAnimationFrame loop. */
(function () {
  'use strict';
  const E = window.Elion;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let started = false;

  E.startPhone = function (products, onOpen) {
    const phone = document.getElementById('phone'), stage = document.getElementById('stage');
    if (!phone || !stage) return;
    if (!started) {
      started = true;
      // build the edge of the phone from thin slices so it has real thickness
      const first = phone.firstChild;
      for (let z = -6; z <= 6; z++) {
        const s = document.createElement('div'); s.className = 'rim';
        s.style.transform = 'translateZ(' + z + 'px)';
        s.style.background = Math.abs(z) % 2 ? '#2a2f37' : '#161a1f';
        phone.insertBefore(s, first);
      }
      let angle = -28, vel = 0, drag = false, lastX = 0, visible = true, last = performance.now();
      if (window.IntersectionObserver) new IntersectionObserver(en => { visible = en[0].isIntersecting; }, { threshold: 0.01 }).observe(stage);
      stage.addEventListener('pointerdown', e => { drag = true; lastX = e.clientX; vel = 0; try { stage.setPointerCapture(e.pointerId); } catch (x) {} stage.style.cursor = 'grabbing'; });
      stage.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - lastX; lastX = e.clientX; angle += dx * 0.7; vel = dx * 0.7; });
      const up = () => { drag = false; stage.style.cursor = ''; };
      stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
      stage.addEventListener('click', () => { if (E._phoneCurrent && onOpen) onOpen(E._phoneCurrent); });
      const frame = now => {
        const dt = Math.min(50, now - last) / 1000; last = now;
        if (visible && !reduce) {
          if (!drag) { angle += 26 * dt + vel; vel *= 0.94; if (Math.abs(vel) < 0.02) vel = 0; }
          const bob = Math.sin(now / 900) * 5;
          phone.style.setProperty('--ry', angle.toFixed(2) + 'deg');
          phone.style.translate = '0 ' + bob.toFixed(1) + 'px';
        }
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
      const clock = document.getElementById('clock');
      const tick = () => { const d = new Date(); clock.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
      tick(); setInterval(tick, 20000);
    }
    // slideshow on the phone screen: shows real products from the store
    const slides = Array.from(document.querySelectorAll('.slide'));
    const list = products.filter(p => p.images && p.images[0]).slice(0, 8);
    clearInterval(E._phoneTimer);
    if (!list.length) return;
    let i = 0, which = 0;
    const show = () => {
      const p = list[i % list.length]; E._phoneCurrent = p.id;
      const el = slides[which % 2], other = slides[(which + 1) % 2];
      el.style.backgroundImage = 'url("' + E.assetUrl(p.images[0]) + '")';
      el.classList.add('on'); other.classList.remove('on');
      document.getElementById('capName').textContent = p.name;
      document.getElementById('capPrice').textContent = p.price ? E.money(p.price) : 'Call for price';
      i++; which++;
    };
    show(); E._phoneTimer = setInterval(show, 3200);
  };
  E.assetUrl = u => u;
})();
